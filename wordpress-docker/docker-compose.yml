version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: plumberx_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - plumberx_net

  wordpress:
    image: wordpress:latest
    container_name: plumberx_wp
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_pass
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./theme/plumberx:/var/www/html/wp-content/themes/plumberx
    ports:
      - "8080:80"
    networks:
      - plumberx_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: plumberx_pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "8081:80"
    networks:
      - plumberx_net

volumes:
  db_data:
  wp_data:

networks:
  plumberx_net:
    driver: bridge
